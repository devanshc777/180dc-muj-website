<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cyber Globe — 180DC</title>
<style>
  :root {
    --green: #73b744;
    --green-deep: #049648;
    --ink: #05070a;
    --paper: #f5f7fa;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--ink);
    color: var(--paper);
    font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
    overflow: hidden;
  }

  /* The globe layer. Sits behind everything, spans the viewport. */
  #globe-canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    z-index: 0;
    opacity: 0;
    transition: opacity 900ms ease;
  }
  #globe-canvas.ready { opacity: 1; }

  /* A soft vignette keeps foreground text legible over the limb of the globe. */
  #vignette {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background:
      radial-gradient(120% 90% at 20% 50%, rgba(5, 7, 10, 0.92) 0%, rgba(5, 7, 10, 0.55) 35%, rgba(5, 7, 10, 0) 70%),
      linear-gradient(to bottom, rgba(5, 7, 10, 0.6) 0%, rgba(5, 7, 10, 0) 25%, rgba(5, 7, 10, 0) 75%, rgba(5, 7, 10, 0.7) 100%);
  }

  /* Demo foreground. Container ignores pointer events so drags fall through to
     the globe; only real interactive children opt back in. */
  #content {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 clamp(24px, 7vw, 140px);
    max-width: 900px;
    pointer-events: none;
  }
  #content a, #content button { pointer-events: auto; }

  .eyebrow {
    font-size: clamp(11px, 1vw, 13px);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--green);
    margin: 0 0 20px;
    font-weight: 600;
  }
  h1 {
    font-size: clamp(38px, 6.4vw, 82px);
    line-height: 1.02;
    letter-spacing: -0.03em;
    margin: 0 0 24px;
    font-weight: 700;
  }
  h1 em { font-style: normal; color: var(--green); }
  p.lede {
    font-size: clamp(15px, 1.5vw, 19px);
    line-height: 1.6;
    max-width: 46ch;
    color: rgba(245, 247, 250, 0.72);
    margin: 0 0 36px;
  }
  .cta {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    align-self: flex-start;
    padding: 14px 26px;
    border-radius: 999px;
    background: var(--green);
    color: #06210a;
    font-weight: 650;
    font-size: 15px;
    text-decoration: none;
    transition: transform 180ms ease, background 180ms ease;
  }
  .cta:hover { transform: translateY(-2px); background: #85c956; }

  .hint {
    position: fixed;
    right: 28px;
    bottom: 24px;
    z-index: 2;
    font-size: 12px;
    letter-spacing: 0.08em;
    color: rgba(245, 247, 250, 0.34);
    pointer-events: none;
  }

  /* Narrow screens: the globe sits under the copy, so the scrim runs top-down
     instead of left-to-right. */
  @media (max-width: 900px) {
    #vignette {
      background:
        linear-gradient(to bottom, rgba(5, 7, 10, 0.94) 0%, rgba(5, 7, 10, 0.86) 42%, rgba(5, 7, 10, 0.25) 68%, rgba(5, 7, 10, 0.55) 100%);
    }
    #content { justify-content: flex-start; padding-top: 14vh; }
  }

  @media (prefers-reduced-motion: reduce) {
    #globe-canvas { transition: none; }
  }
</style>
</head>
<body>

<canvas id="globe-canvas"></canvas>
<div id="vignette"></div>

<main id="content">
  <p class="eyebrow">180 Degrees Consulting</p>
  <h1>Consulting for the world's most <em>ambitious</em> nonprofits.</h1>
  <p class="lede">
    The largest student-run consultancy on earth. Chapters in over 35 countries,
    delivering pro-bono strategy to organisations that need it most.
  </p>
  <a class="cta" href="#">Work with us &rarr;</a>
</main>

<p class="hint">drag to rotate</p>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js';

/* ------------------------------------------------------------------ *
 * Tuning knobs. Everything worth changing lives here.
 * ------------------------------------------------------------------ */
const CONFIG = {
  // Geodesic frequency. Cell count = 10 * f^2 + 2.
  //   f=16 ->  2,562 cells (chunky, graphic)
  //   f=26 ->  6,762 cells (balanced)
  //   f=38 -> 14,442 cells (fine texture, default)
  //   f=52 -> 27,042 cells (near-smooth, heavier)
  frequency: 38,

  landColor: 0x73b744,        // 180DC bright green
  oceanColor: 0x0e1210,       // near-black; pure black kills the hex texture entirely
  atmosphereColor: 0x049648,  // 180DC jade, limb glow only
  background: null,           // null = transparent canvas, page bg shows through

  cellInset: 0.10,            // 0 = tiles touch, 0.2 = wide gaps between hexes
  landLift: 0.007,            // land extrusion as a fraction of globe radius
  tintJitter: 0.20,           // per-cell brightness variation; this is the "texture"

  spinSpeed: 0.045,           // idle rotation, rad/sec
  dragSpeed: 0.0042,          // radians per pixel dragged
  inertiaDamping: 0.94,       // per-frame velocity decay after release; <1
  maxPitch: 1.05,             // clamp vertical rotation, radians (~60deg)
  parallax: 0.06,             // camera drift toward cursor
  cameraDistance: 3.55,       // multiples of globe radius; larger = smaller globe
  globeOffsetX: 0.48,         // shift globe right so left-side text has room; 0 = centred
  narrowZoomOut: 1.5,         // extra pull-back under 900px wide
  narrowOffsetY: -0.55,       // and drop it below the copy

  bloom: false,               // lazily loads the postprocessing modules when true
  bloomStrength: 0.42,
};

const LANDMASK_URI = '__LANDMASK_B64__';
const RADIUS = 1;
const TAU = Math.PI * 2;

/* ------------------------------------------------------------------ *
 * Geodesic sphere -> Goldberg polyhedron (its dual).
 *
 * Subdividing an icosahedron gives triangles. The DUAL of that mesh -
 * one polygon per triangle-vertex, its corners at the surrounding face
 * centroids - gives hexagons everywhere except the 12 original
 * icosahedron vertices, which are unavoidably pentagons. That is a
 * Goldberg polyhedron, and it is the only way to tile a sphere in
 * near-uniform hexagons.
 * ------------------------------------------------------------------ */
function buildGoldberg(frequency) {
  const t = (1 + Math.sqrt(5)) / 2;
  const baseVerts = [
    [-1, t, 0], [1, t, 0], [-1, -t, 0], [1, -t, 0],
    [0, -1, t], [0, 1, t], [0, -1, -t], [0, 1, -t],
    [t, 0, -1], [t, 0, 1], [-t, 0, -1], [-t, 0, 1],
  ].map(v => new THREE.Vector3(...v).normalize());

  const baseFaces = [
    [0, 11, 5], [0, 5, 1], [0, 1, 7], [0, 7, 10], [0, 10, 11],
    [1, 5, 9], [5, 11, 4], [11, 10, 2], [10, 7, 6], [7, 1, 8],
    [3, 9, 4], [3, 4, 2], [3, 2, 6], [3, 6, 8], [3, 8, 9],
    [4, 9, 5], [2, 4, 11], [6, 2, 10], [8, 6, 7], [9, 8, 1],
  ];

  const verts = [];
  const vertKeys = new Map();
  // Quantise to merge the vertices shared along each icosahedral edge.
  const keyOf = v => `${Math.round(v.x * 1e5)},${Math.round(v.y * 1e5)},${Math.round(v.z * 1e5)}`;

  function addVert(v) {
    const k = keyOf(v);
    let i = vertKeys.get(k);
    if (i === undefined) {
      i = verts.length;
      vertKeys.set(k, i);
      verts.push(v);
    }
    return i;
  }

  const faces = [];
  const tmpA = new THREE.Vector3(), tmpB = new THREE.Vector3(), tmpC = new THREE.Vector3();

  for (const [ia, ib, ic] of baseFaces) {
    const a = baseVerts[ia], b = baseVerts[ib], c = baseVerts[ic];
    // Barycentric lattice over the triangle, each point pushed to the sphere.
    const grid = [];
    for (let i = 0; i <= frequency; i++) {
      const row = [];
      for (let j = 0; j <= frequency - i; j++) {
        const k = frequency - i - j;
        tmpA.copy(a).multiplyScalar(k);
        tmpB.copy(b).multiplyScalar(j);
        tmpC.copy(c).multiplyScalar(i);
        const p = tmpA.clone().add(tmpB).add(tmpC).normalize();
        row.push(addVert(p));
      }
      grid.push(row);
    }
    for (let i = 0; i < frequency; i++) {
      for (let j = 0; j < frequency - i; j++) {
        faces.push([grid[i][j], grid[i][j + 1], grid[i + 1][j]]);
        if (j < frequency - i - 1) {
          faces.push([grid[i][j + 1], grid[i + 1][j + 1], grid[i + 1][j]]);
        }
      }
    }
  }

  // Centroid of every triangle, projected back onto the sphere.
  const centroids = faces.map(([x, y, z]) =>
    verts[x].clone().add(verts[y]).add(verts[z]).normalize()
  );

  // Each geodesic vertex becomes one cell; its corners are the surrounding centroids.
  const incident = Array.from({ length: verts.length }, () => []);
  faces.forEach((f, fi) => { for (const vi of f) incident[vi].push(fi); });

  const up = new THREE.Vector3(), right = new THREE.Vector3(), fwd = new THREE.Vector3();
  const cells = [];

  for (let vi = 0; vi < verts.length; vi++) {
    const centre = verts[vi];
    const ring = incident[vi];
    if (ring.length < 5) continue; // degenerate; shouldn't happen on a closed sphere

    // Sort corners by angle in the tangent plane, so the fan winds consistently.
    up.copy(centre);
    right.set(0, 1, 0);
    if (Math.abs(up.y) > 0.9) right.set(1, 0, 0);
    fwd.crossVectors(up, right).normalize();
    right.crossVectors(fwd, up).normalize();

    const sorted = ring
      .map(fi => {
        const d = centroids[fi];
        return { fi, angle: Math.atan2(d.dot(fwd), d.dot(right)) };
      })
      .sort((p, q) => p.angle - q.angle)
      .map(entry => centroids[entry.fi]);

    cells.push({ centre, corners: sorted });
  }

  return cells;
}

/* ------------------------------------------------------------------ *
 * Land mask sampling.
 * ------------------------------------------------------------------ */
function loadLandSampler(uri) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const cv = document.createElement('canvas');
      cv.width = img.width;
      cv.height = img.height;
      const ctx = cv.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(img, 0, 0);
      const { data, width, height } = ctx.getImageData(0, 0, img.width, img.height);

      // Direction vector -> equirectangular pixel -> land?
      resolve(function isLand(v) {
        const lat = Math.asin(THREE.MathUtils.clamp(v.y, -1, 1));      // -pi/2..pi/2
        const lon = Math.atan2(v.z, -v.x);                             // -pi..pi
        const x = Math.min(width - 1, Math.max(0, Math.floor((lon / TAU + 0.5) * width)));
        const y = Math.min(height - 1, Math.max(0, Math.floor((0.5 - lat / Math.PI) * height)));
        return data[(y * width + x) * 4] > 127;
      });
    };
    img.onerror = () => reject(new Error('land mask failed to decode'));
    img.src = uri;
  });
}

/* ------------------------------------------------------------------ *
 * Cells -> two meshes (land, ocean).
 * ------------------------------------------------------------------ */
function buildCellGeometry(cells, isLand) {
  const buffers = {
    land: { pos: [], col: [] },
    ocean: { pos: [], col: [] },
  };

  const c = new THREE.Vector3();
  const p0 = new THREE.Vector3();
  const p1 = new THREE.Vector3();

  let landCount = 0;

  for (const cell of cells) {
    const land = isLand(cell.centre);
    if (land) landCount++;

    const target = land ? buffers.land : buffers.ocean;
    const lift = RADIUS * (land ? 1 + CONFIG.landLift : 1);

    // Per-cell brightness jitter. This is what makes the surface read as
    // texture rather than as one flat colour.
    const tint = 1 + (Math.random() - 0.5) * 2 * CONFIG.tintJitter;

    c.copy(cell.centre).multiplyScalar(lift);
    const n = cell.corners.length;

    for (let i = 0; i < n; i++) {
      // Inset each corner toward the cell centre to open the gap between tiles.
      p0.copy(cell.corners[i]).multiplyScalar(lift).lerp(c, CONFIG.cellInset);
      p1.copy(cell.corners[(i + 1) % n]).multiplyScalar(lift).lerp(c, CONFIG.cellInset);

      // Cap triangle (fan from centre).
      target.pos.push(c.x, c.y, c.z, p0.x, p0.y, p0.z, p1.x, p1.y, p1.z);
      for (let k = 0; k < 3; k++) target.col.push(tint, tint, tint);

      // Land gets side walls so the extrusion catches the key light.
      if (land) {
        const b0 = p0.clone().setLength(RADIUS);
        const b1 = p1.clone().setLength(RADIUS);
        target.pos.push(p0.x, p0.y, p0.z, b0.x, b0.y, b0.z, p1.x, p1.y, p1.z);
        target.pos.push(p1.x, p1.y, p1.z, b0.x, b0.y, b0.z, b1.x, b1.y, b1.z);
        const wall = tint * 0.62; // walls sit in shadow
        for (let k = 0; k < 6; k++) target.col.push(wall, wall, wall);
      }
    }
  }

  function toGeometry(buf) {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(buf.pos, 3));
    g.setAttribute('color', new THREE.Float32BufferAttribute(buf.col, 3));
    g.computeVertexNormals();
    return g;
  }

  return {
    land: toGeometry(buffers.land),
    ocean: toGeometry(buffers.ocean),
    landCount,
    total: cells.length,
  };
}

/* ------------------------------------------------------------------ *
 * Scene.
 * ------------------------------------------------------------------ */
const canvas = document.getElementById('globe-canvas');
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias: true,
  alpha: CONFIG.background === null,
  powerPreference: 'high-performance',
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;

const scene = new THREE.Scene();
if (CONFIG.background !== null) scene.background = new THREE.Color(CONFIG.background);

const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 100);
camera.position.set(0, 0, RADIUS * CONFIG.cameraDistance);

// pivot carries the user's rotation; tilt carries the parallax drift.
const tilt = new THREE.Group();
const pivot = new THREE.Group();
tilt.add(pivot);
scene.add(tilt);

// Key, fill and rim. Deliberately not a studio setup - one strong source
// reads as a sun, which is what makes a globe look like a globe.
const key = new THREE.DirectionalLight(0xffffff, 2.4);
key.position.set(-1.1, 0.8, 1.6);
scene.add(key);

const rim = new THREE.DirectionalLight(0x9fd977, 1.1);
rim.position.set(1.4, -0.3, -1.1);
scene.add(rim);

// Head-on fill at low intensity. Without it the unlit half of the ocean goes
// to pure black and the hex texture disappears on that side entirely.
const fill = new THREE.DirectionalLight(0xbcd4e6, 0.55);
fill.position.set(0.2, 0.1, 2.2);
scene.add(fill);

scene.add(new THREE.AmbientLight(0x2a3a44, 1.1));

// Solid core, slightly under the tiles, so gaps never show through to space.
const core = new THREE.Mesh(
  new THREE.SphereGeometry(RADIUS * 0.985, 64, 48),
  new THREE.MeshStandardMaterial({ color: 0x040605, roughness: 1, metalness: 0 })
);
pivot.add(core);

// Fresnel limb glow. Back-faced and additive, so it only shows at the edge.
const atmosphere = new THREE.Mesh(
  new THREE.SphereGeometry(RADIUS * 1.055, 64, 48),
  new THREE.ShaderMaterial({
    uniforms: { uColor: { value: new THREE.Color(CONFIG.atmosphereColor) } },
    vertexShader: `
      varying vec3 vNormal;
      varying vec3 vView;
      void main() {
        vNormal = normalize(normalMatrix * normal);
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        vView = normalize(-mv.xyz);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      uniform vec3 uColor;
      varying vec3 vNormal;
      varying vec3 vView;
      void main() {
        float f = pow(1.0 - abs(dot(vNormal, vView)), 3.2);
        gl_FragColor = vec4(uColor * f * 1.5, f);
      }`,
    blending: THREE.AdditiveBlending,
    side: THREE.BackSide,
    transparent: true,
    depthWrite: false,
  })
);
scene.add(atmosphere);

/* ------------------------------------------------------------------ *
 * Interaction: drag with inertia, idle spin, cursor parallax.
 * ------------------------------------------------------------------ */
const state = {
  yaw: 0.6,
  pitch: 0.22,
  velYaw: 0,
  velPitch: 0,
  dragging: false,
  lastX: 0,
  lastY: 0,
  pointerX: 0,
  pointerY: 0,
  running: true,
  visible: true,
};

canvas.style.touchAction = 'none';
canvas.style.cursor = 'grab';

canvas.addEventListener('pointerdown', e => {
  state.dragging = true;
  state.lastX = e.clientX;
  state.lastY = e.clientY;
  state.velYaw = state.velPitch = 0;
  // Throws on synthetic events and on some older mobile browsers; capture is a
  // nicety (it keeps the drag alive off-canvas), never a requirement.
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  canvas.style.cursor = 'grabbing';
});

canvas.addEventListener('pointermove', e => {
  state.pointerX = (e.clientX / window.innerWidth) * 2 - 1;
  state.pointerY = (e.clientY / window.innerHeight) * 2 - 1;
  if (!state.dragging) return;
  const dx = e.clientX - state.lastX;
  const dy = e.clientY - state.lastY;
  state.lastX = e.clientX;
  state.lastY = e.clientY;
  state.velYaw = dx * CONFIG.dragSpeed;
  state.velPitch = dy * CONFIG.dragSpeed;
  state.yaw += state.velYaw;
  state.pitch = THREE.MathUtils.clamp(state.pitch + state.velPitch, -CONFIG.maxPitch, CONFIG.maxPitch);
});

function endDrag(e) {
  if (!state.dragging) return;
  state.dragging = false;
  try {
    if (e && e.pointerId !== undefined && canvas.hasPointerCapture(e.pointerId)) {
      canvas.releasePointerCapture(e.pointerId);
    }
  } catch (_) {}
  canvas.style.cursor = 'grab';
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
canvas.addEventListener('pointerleave', endDrag);

// Pause when the tab is hidden or the canvas scrolls out of view. A background
// animation burning GPU behind another tab is the single rudest thing a hero can do.
document.addEventListener('visibilitychange', () => {
  state.visible = !document.hidden;
});
new IntersectionObserver(entries => {
  state.running = entries[0].isIntersecting;
}, { threshold: 0 }).observe(canvas);

function resize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  const narrow = w < 900;

  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(w, h, false);
  camera.aspect = w / h;

  // On a phone the globe has to shrink and drop, or the copy ends up sitting on
  // top of bright green land with nothing behind it.
  camera.position.z = RADIUS * CONFIG.cameraDistance * (narrow ? CONFIG.narrowZoomOut : 1);

  // Nudge the globe in world space rather than by moving the camera, so the
  // parallax and the offset don't fight each other.
  tilt.position.x = narrow ? 0 : CONFIG.globeOffsetX;
  tilt.position.y = narrow ? CONFIG.narrowOffsetY : 0;

  camera.updateProjectionMatrix();
  if (composer) composer.setSize(w, h);
}
window.addEventListener('resize', resize);

/* ------------------------------------------------------------------ *
 * Boot.
 * ------------------------------------------------------------------ */
let composer = null;
let stats = null;

async function init() {
  const t0 = performance.now();

  const isLand = await loadLandSampler(LANDMASK_URI);
  const cells = buildGoldberg(CONFIG.frequency);
  const built = buildCellGeometry(cells, isLand);

  // Ocean tiles are nearly black, so their only visible edge is specular.
  // Low roughness + high metalness is what makes the hex grid readable at all.
  const oceanMat = new THREE.MeshStandardMaterial({
    color: CONFIG.oceanColor,
    roughness: 0.44,
    metalness: 0.75,
    vertexColors: true,
    flatShading: true,
  });
  const landMat = new THREE.MeshStandardMaterial({
    color: CONFIG.landColor,
    roughness: 0.52,
    metalness: 0.06,
    emissive: new THREE.Color(CONFIG.landColor).multiplyScalar(0.12),
    vertexColors: true,
    flatShading: true,
  });

  pivot.add(new THREE.Mesh(built.ocean, oceanMat));
  pivot.add(new THREE.Mesh(built.land, landMat));

  if (CONFIG.bloom) await setupBloom();

  resize();
  canvas.classList.add('ready');

  stats = {
    cells: built.total,
    landCells: built.landCount,
    landFraction: +(built.landCount / built.total).toFixed(3),
    buildMs: Math.round(performance.now() - t0),
    triangles: renderer.info.render.triangles,
  };
  window.__GLOBE__ = { CONFIG, stats, state, renderer };
  console.log('[globe]', stats);
}

async function setupBloom() {
  const base = 'https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/';
  const [{ EffectComposer }, { RenderPass }, { UnrealBloomPass }, { OutputPass }] = await Promise.all([
    import(base + 'postprocessing/EffectComposer.js'),
    import(base + 'postprocessing/RenderPass.js'),
    import(base + 'postprocessing/UnrealBloomPass.js'),
    import(base + 'postprocessing/OutputPass.js'),
  ]);
  composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  composer.addPass(new UnrealBloomPass(
    new THREE.Vector2(window.innerWidth, window.innerHeight),
    CONFIG.bloomStrength, 0.6, 0.85
  ));
  composer.addPass(new OutputPass());
}

// THREE.Clock is deprecated as of r186; performance.now covers what we need.
let lastT = performance.now();

function frame() {
  requestAnimationFrame(frame);
  if (!state.running || !state.visible) return;

  const now = performance.now();
  const dt = Math.min((now - lastT) / 1000, 0.05); // clamp, so a stalled tab doesn't lurch
  lastT = now;

  if (!state.dragging) {
    // Inertia, then idle spin once it has bled off.
    //
    // Damping is normalised to elapsed time. A flat per-frame multiply would
    // make a thrown globe coast for a different distance on a 144Hz monitor
    // than on a 60Hz one - the classic frame-rate-dependent-physics bug.
    const decay = Math.pow(CONFIG.inertiaDamping, dt * 60);
    state.yaw += state.velYaw * dt * 60;
    state.pitch = THREE.MathUtils.clamp(
      state.pitch + state.velPitch * dt * 60, -CONFIG.maxPitch, CONFIG.maxPitch
    );
    state.velYaw *= decay;
    state.velPitch *= decay;
    if (Math.abs(state.velYaw) < 1e-4) state.velYaw = 0;
    if (Math.abs(state.velPitch) < 1e-4) state.velPitch = 0;
    if (!reduceMotion) state.yaw += CONFIG.spinSpeed * dt;
  }

  pivot.rotation.y = state.yaw;
  pivot.rotation.x = state.pitch;

  if (!reduceMotion) {
    const px = -state.pointerX * CONFIG.parallax;
    const py = -state.pointerY * CONFIG.parallax * 0.6;
    const k = 1 - Math.pow(1 - 0.05, dt * 60); // same reasoning as the damping above
    tilt.rotation.y += (px - tilt.rotation.y) * k;
    tilt.rotation.x += (py - tilt.rotation.x) * k;
  }

  atmosphere.position.copy(tilt.position);

  if (composer) composer.render();
  else renderer.render(scene, camera);
}

init().then(frame).catch(err => {
  console.error('[globe] init failed', err);
});
</script>
</body>
</html>
